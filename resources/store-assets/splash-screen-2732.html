<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Splash Screen - 2732x2732</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #111;
            font-family: 'Segoe UI', system-ui, sans-serif;
        }
        .splash-container {
            width: 2732px;
            height: 2732px;
            background: linear-gradient(180deg, #1a1a2e 0%, #16213e 30%, #0f3460 60%, #1a1a2e 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;
        }
        /* Animated gradient background */
        .splash-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: 
                radial-gradient(ellipse at 30% 20%, rgba(255,107,53,0.15) 0%, transparent 50%),
                radial-gradient(ellipse at 70% 80%, rgba(0,212,170,0.1) 0%, transparent 50%);
            pointer-events: none;
        }
        /* Desert ground - lower on splash */
        .desert {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 25%;
            background: linear-gradient(180deg, transparent 0%, #d4a574 30%, #c4956a 70%, #b8895e 100%);
        }
        /* Cacti silhouettes */
        .cactus {
            position: absolute;
            bottom: 20%;
            background: #2d5a3d;
            opacity: 0.6;
        }
        .cactus-1 {
            left: 5%;
            width: 80px;
            height: 300px;
            border-radius: 40px 40px 10px 10px;
        }
        .cactus-2 {
            left: 12%;
            width: 100px;
            height: 400px;
            border-radius: 50px 50px 15px 15px;
        }
        .cactus-2::before {
            content: '';
            position: absolute;
            top: 30%;
            left: -50px;
            width: 70px;
            height: 140px;
            background: #2d5a3d;
            border-radius: 35px;
            transform: rotate(-30deg);
        }
        .cactus-3 {
            right: 8%;
            width: 120px;
            height: 500px;
            border-radius: 60px 60px 20px 20px;
        }
        .cactus-3::before {
            content: '';
            position: absolute;
            top: 25%;
            right: -60px;
            width: 80px;
            height: 160px;
            background: #2d5a3d;
            border-radius: 40px;
            transform: rotate(25deg);
        }
        .cactus-3::after {
            content: '';
            position: absolute;
            top: 45%;
            left: -50px;
            width: 70px;
            height: 140px;
            background: #2d5a3d;
            border-radius: 35px;
            transform: rotate(-20deg);
        }
        .cactus-4 {
            right: 20%;
            width: 60px;
            height: 200px;
            border-radius: 30px 30px 8px 8px;
            opacity: 0.4;
        }
        /* Main logo area */
        .logo-area {
            position: relative;
            z-index: 10;
            text-align: center;
        }
        /* Disc golf basket icon */
        .basket-icon {
            margin-bottom: 80px;
        }
        .basket-top {
            width: 400px;
            height: 240px;
            background: linear-gradient(180deg, #ffd700 0%, #ffb800 50%, #ff9500 100%);
            border-radius: 200px 200px 40px 40px;
            margin: 0 auto;
            border: 16px solid #ff6b00;
            position: relative;
        }
        .basket-chains {
            position: absolute;
            top: 100%;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 24px;
        }
        .chain {
            width: 12px;
            height: 160px;
            background: linear-gradient(180deg, #ddd 0%, #999 100%);
            border-radius: 6px;
        }
        .basket-tray {
            width: 360px;
            height: 60px;
            background: linear-gradient(180deg, #555 0%, #333 100%);
            border-radius: 20px;
            margin: 130px auto 0;
            border: 8px solid #222;
        }
        .basket-pole {
            width: 48px;
            height: 300px;
            background: linear-gradient(90deg, #777 0%, #bbb 50%, #777 100%);
            margin: 0 auto;
            border-radius: 24px;
        }
        /* Flying disc */
        .flying-disc {
            position: absolute;
            top: 15%;
            right: 25%;
            width: 280px;
            height: 100px;
            background: linear-gradient(180deg, #ff6b35 0%, #f7931e 50%, #ffcc00 100%);
            border-radius: 140px / 50px;
            transform: rotate(-20deg);
            box-shadow: 
                inset 0 -20px 40px rgba(0,0,0,0.3),
                0 20px 60px rgba(0,0,0,0.4);
            z-index: 5;
        }
        .flying-disc::before {
            content: '';
            position: absolute;
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
            width: 120px;
            height: 40px;
            background: rgba(255,255,255,0.3);
            border-radius: 60px / 20px;
        }
        /* App name */
        .app-name {
            margin-top: 60px;
        }
        .app-name h1 {
            font-size: 200px;
            font-weight: 800;
            color: #fff;
            text-shadow: 
                0 8px 30px rgba(0,0,0,0.5),
                0 0 100px rgba(255,107,53,0.3);
            letter-spacing: -5px;
            line-height: 1;
        }
        .app-name h1 span {
            color: #ff6b35;
        }
        .app-name h2 {
            font-size: 140px;
            font-weight: 800;
            color: #ff6b35;
            text-shadow: 0 4px 20px rgba(255,107,53,0.5);
            margin-top: -20px;
        }
        .tagline {
            font-size: 64px;
            color: #00d4aa;
            margin-top: 40px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 20px;
            text-shadow: 0 4px 20px rgba(0,212,170,0.4);
        }
        /* Lock Jaw branding at bottom */
        .branding {
            position: absolute;
            bottom: 8%;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
            z-index: 10;
        }
        .brand-logo {
            width: 120px;
            height: 120px;
            background: linear-gradient(135deg, #00d4aa, #00a080);
            border-radius: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 60px;
            font-weight: 800;
            color: #fff;
            margin: 0 auto 30px;
            box-shadow: 0 10px 40px rgba(0,212,170,0.3);
        }
        .brand-text {
            color: #fff;
            font-size: 36px;
            opacity: 0.7;
        }
        /* Subtle pattern overlay */
        .pattern {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-image: 
                radial-gradient(circle at 2px 2px, rgba(255,255,255,0.02) 1px, transparent 0);
            background-size: 60px 60px;
            pointer-events: none;
        }
        .instructions {
            position: fixed;
            bottom: 20px;
            left: 20px;
            background: rgba(0,0,0,0.9);
            color: #fff;
            padding: 15px 20px;
            border-radius: 8px;
            font-size: 14px;
            z-index: 1000;
        }
    </style>
</head>
<body>
    <div class="splash-container">
        <div class="pattern"></div>
        <div class="desert"></div>
        <div class="cactus cactus-1"></div>
        <div class="cactus cactus-2"></div>
        <div class="cactus cactus-3"></div>
        <div class="cactus cactus-4"></div>
        
        <div class="flying-disc"></div>
        
        <div class="logo-area">
            <div class="basket-icon">
                <div class="basket-top">
                    <div class="basket-chains">
                        <div class="chain"></div>
                        <div class="chain"></div>
                        <div class="chain"></div>
                        <div class="chain"></div>
                        <div class="chain"></div>
                        <div class="chain"></div>
                        <div class="chain"></div>
                        <div class="chain"></div>
                        <div class="chain"></div>
                    </div>
                </div>
                <div class="basket-tray"></div>
                <div class="basket-pole"></div>
            </div>
            
            <div class="app-name">
                <h1>Putting</h1>
                <h2>Improver</h2>
                <p class="tagline">Disc Golf Practice</p>
            </div>
        </div>
        
        <div class="branding">
            <div class="brand-logo">LJ</div>
            <div class="brand-text">Lock Jaw Disc Golf • Tucson, AZ</div>
        </div>
    </div>
    <div class="instructions">
        📱 Splash Screen 2732x2732<br>
        Use browser zoom out to see full image, then screenshot<br>
        Or use a screenshot tool at specific dimensions
    </div>
</body>
</html>
