    <!-- Service Worker Registration -->
    <script>
        // Detect platform
        const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
        const isInStandaloneMode = ('standalone' in window.navigator) && (window.navigator.standalone);
        const isCapacitorNative = window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform();

        // App version tracking
        const APP_VERSION = '10.5.56';
        const STORED_VERSION = localStorage.getItem('app_version');

        // Check if version changed - show notification instead of forcing reload
        if (STORED_VERSION && STORED_VERSION !== APP_VERSION) {
            console.log(`🔄 Version changed from ${STORED_VERSION} to ${APP_VERSION}`);
            localStorage.setItem('app_version', APP_VERSION);
            
            // Clear old caches in background (don't force reload)
            if ('caches' in window) {
                caches.keys().then(names => {
                    names.forEach(name => {
                        if (!name.includes(APP_VERSION)) {
                            console.log('Deleting old cache:', name);
                            caches.delete(name);
                        }
                    });
                });
            }
        } else if (!STORED_VERSION) {
            localStorage.setItem('app_version', APP_VERSION);
        }

        // Register service worker for PWA functionality (skip in native Capacitor app)
        if ('serviceWorker' in navigator && !isCapacitorNative) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/service-worker.js')
                    .then((registration) => {
                        console.log('ServiceWorker registered:', registration.scope);

                        // Check for updates every 2 minutes (balanced)
                        setInterval(() => {
                            registration.update();
                        }, 120000);

                        // Handle updates - show non-blocking notification
                        registration.addEventListener('updatefound', () => {
                            const newWorker = registration.installing;
                            console.log('🆕 New service worker found, installing...');
                            
                            newWorker.addEventListener('statechange', () => {
                                if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                                    console.log('✅ New version ready');
                                    // Show update toast - let user decide when to reload
                                    showUpdateAvailableToast(newWorker);
                                }
                            });
                        });
                    })
                    .catch((error) => {
                        console.log('ServiceWorker registration failed:', error);
                    });

                // Handle service worker controller change
                let refreshing = false;
                navigator.serviceWorker.addEventListener('controllerchange', () => {
                    if (!refreshing) {
                        refreshing = true;
                        console.log('🔄 Service worker updated');
                    }
                });
            });
        }

        // Show update available toast - non-blocking
        function showUpdateAvailableToast(newWorker) {
            // Remove existing update toast if any
            const existingToast = document.getElementById('updateToast');
            if (existingToast) existingToast.remove();

            const toast = document.createElement('div');
            toast.id = 'updateToast';
            toast.innerHTML = `
                <div style="position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%); 
                            background: linear-gradient(135deg, #00d4aa, #00b894); color: white; 
                            padding: 12px 20px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.3);
                            display: flex; align-items: center; gap: 12px; z-index: 10000; 
                            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
                    <span>🆕 Update available!</span>
                    <button onclick="window.updateApp()" style="background: white; color: #00b894; border: none; 
                            padding: 6px 12px; border-radius: 6px; font-weight: 600; cursor: pointer;">
                        Refresh
                    </button>
                    <button onclick="this.parentElement.parentElement.remove()" style="background: transparent; 
                            color: white; border: none; font-size: 18px; cursor: pointer; padding: 0 4px;">
                        ✕
                    </button>
                </div>
            `;
            document.body.appendChild(toast);

            // Store reference to new worker for update
            window.pendingWorker = newWorker;
            window.updateApp = function() {
                if (window.pendingWorker) {
                    window.pendingWorker.postMessage({ type: 'SKIP_WAITING' });
                }
                window.location.reload();
            };

            // Auto-dismiss after 30 seconds
            setTimeout(() => {
                if (toast.parentElement) toast.remove();
            }, 30000);
        }

        // Add install prompt handler
        let deferredPrompt;

        // Check if already installed (standalone mode)
        const isInstalled = window.matchMedia('(display-mode: standalone)').matches ||
                           window.navigator.standalone === true;

        // For iOS, show custom instructions
        if (isIOS && !isInStandaloneMode) {
            // Make iOS install helper available globally
            window.isIOSInstallable = true;

            // Dispatch event that app can listen for
            window.addEventListener('DOMContentLoaded', () => {
                window.dispatchEvent(new CustomEvent('ios-installable'));
            });
        }
        // For other browsers, use standard install prompt
        else if (!isInstalled && !isIOS) {
            window.addEventListener('beforeinstallprompt', (e) => {
                // Prevent the mini-infobar from appearing on mobile
                e.preventDefault();
                // Stash the event so it can be triggered later
                deferredPrompt = e;
                window.deferredPrompt = e;

                console.log('PWA install prompt available');

                // Show install button in header if it exists
                const installBtn = document.getElementById('pwaInstallBtn');
                if (installBtn) {
                    installBtn.style.display = 'inline-block';
                }

                // Show install button on login screen if it exists
                const installBtnLogin = document.getElementById('pwaInstallBtnLogin');
                if (installBtnLogin) {
                    installBtnLogin.style.display = 'inline-block';
                }

                // Dispatch custom event that the app can listen for
                window.dispatchEvent(new CustomEvent('pwa-installable'));
            });
        } else {
            console.log('App is already installed or on iOS in standalone mode');
        }

        // Track if installed
        window.addEventListener('appinstalled', () => {
            console.log('PWA was installed');
            deferredPrompt = null;
            window.deferredPrompt = null;

            // Hide install button
            const installBtn = document.getElementById('pwaInstallBtn');
            if (installBtn) {
                installBtn.style.display = 'none';
            }

            const installBtnLogin = document.getElementById('pwaInstallBtnLogin');
            if (installBtnLogin) {
                installBtnLogin.style.display = 'none';
            }
        });

        // Add version display to page
        window.addEventListener('DOMContentLoaded', () => {
            const versionDisplay = document.createElement('div');
            versionDisplay.id = 'app-version';
            versionDisplay.textContent = `v${APP_VERSION}`;

            // Check if mobile
            const isMobile = window.innerWidth <= 640;

            versionDisplay.style.cssText = `
                position: fixed;
                bottom: ${isMobile ? '72px' : '8px'};
                right: ${isMobile ? '10px' : '8px'};
                font-size: ${isMobile ? '12px' : '11px'};
                color: rgba(255, 255, 255, 0.7);
                background: rgba(0, 0, 0, 0.4);
                padding: ${isMobile ? '4px 8px' : '2px 6px'};
                border-radius: 4px;
                z-index: 9999;
                pointer-events: none;
                font-family: monospace;
                font-weight: 600;
                backdrop-filter: blur(4px);
            `;
            document.body.appendChild(versionDisplay);
        });
    </script>

    <!-- Load our modular JavaScript - waits for Firebase to be ready -->
